<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>月见洞察｜Signals Under One Moon</title>
  <meta name="description" content="A quiet Mid-Autumn story, told by a red thread and a floating gold ring.">
  <style>
    :root { color-scheme: dark; background:#05070a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; background:#05070a; overflow:hidden; }
    main { width:min(100vw,750px); min-height:100dvh; display:grid; place-items:center; }
    #story { display:block; width:100%; max-height:100dvh; height:auto; touch-action:none; user-select:none; }
    .scene { opacity:0; pointer-events:none; transition:opacity .85s cubic-bezier(.3,.8,.25,1); }
    .scene.active { opacity:1; pointer-events:auto; }
    .hit { cursor:grab; }
    .hit:active { cursor:grabbing; }
    #moonlit, #waterReflection, #ripples, #festival { opacity:0; transition:opacity 1.35s ease; }
    #frame3.revealed #moonlit { opacity:1; }
    #frame3.revealed #waterReflection, #frame3.revealed #ripples { opacity:1; transition-delay:.45s; }
    #frame3.revealed #festival { opacity:1; transition-delay:1.55s; }
    .a11y { position:fixed; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  </style>
</head>
<body>
  <main>
    <svg id="story" viewBox="0 0 1024 1536" role="button" tabindex="0" aria-label="红绳与金环的中秋互动故事">
      <defs>
        <filter id="goldGlow" x="-160%" y="-160%" width="420%" height="420%"><feGaussianBlur stdDeviation="7" result="soft"/><feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="waterSoft" x="-40%" y="-120%" width="180%" height="340%"><feGaussianBlur stdDeviation=".36"/></filter>
        <filter id="waterMotion" x="-18%" y="-35%" width="136%" height="170%">
          <feTurbulence type="fractalNoise" baseFrequency=".004 .012" numOctaves="1" seed="8" result="waterNoise"><animate attributeName="baseFrequency" dur="4.8s" values=".003 .009;.012 .032;.005 .014;.003 .009" keyTimes="0;.34;.7;1" repeatCount="indefinite"/></feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="waterNoise" scale="0" xChannelSelector="R" yChannelSelector="G"><animate attributeName="scale" dur="4.8s" values="0;2.8;1.1;0" keyTimes="0;.34;.7;1" repeatCount="indefinite"/></feDisplacementMap>
        </filter>
        <filter id="typeMist" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation=".52"/></filter>
        <radialGradient id="ringHalo"><stop offset="0" stop-color="#fff3cb" stop-opacity=".66"/><stop offset=".38" stop-color="#e9bb69" stop-opacity=".15"/><stop offset="1" stop-color="#d8a14f" stop-opacity="0"/></radialGradient>
        <clipPath id="moonClip"><circle id="moonMask" cx="828" cy="-24" r="0"><animate id="moonReveal" attributeName="r" begin="indefinite" dur="1.5s" values="0;85;390" keyTimes="0;.18;1" fill="freeze"/></circle></clipPath>
        <clipPath id="waterSurface"><ellipse cx="563" cy="1009" rx="207" ry="82"/></clipPath>
      </defs>

      <!-- 第一幕：纸月初见。红绳被轻牵，金环把视线引向下一幕。 -->
      <g id="frame1" class="scene active">
        <image href="hero-story-1.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none"/>
        <g pointer-events="none" transform="translate(590 1215)">
          <circle r="37" fill="url(#ringHalo)" opacity=".48" filter="url(#goldGlow)"><animate attributeName="opacity" values=".18;.7;.18" dur="3.1s" repeatCount="indefinite"/></circle>
          <circle r="16" fill="none" stroke="#f5d592" stroke-width="1.5" opacity=".78"/>
        </g>
        <g id="pull1" class="hit" aria-label="轻牵红绳，继续故事">
          <path d="M0 1488 C178 1418 312 1305 590 1215" fill="none" stroke="transparent" stroke-width="76" stroke-linecap="round"/>
          <circle cx="590" cy="1215" r="35" fill="transparent"/>
        </g>
      </g>

      <!-- 第二幕：金环引月。金环停在红绳中段，下一次轻牵把月影送向碗中。 -->
      <g id="frame2" class="scene">
        <image href="hero-story-2.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none"/>
        <g pointer-events="none" transform="translate(548 638)">
          <circle r="39" fill="url(#ringHalo)" opacity=".52" filter="url(#goldGlow)"><animate attributeName="opacity" values=".2;.76;.2" dur="3.2s" repeatCount="indefinite"/></circle>
          <circle r="17" fill="none" stroke="#f5d592" stroke-width="1.5" opacity=".78"/>
        </g>
        <g id="pull2" class="hit" aria-label="轻牵红绳，让月影入碗">
          <path d="M70 1500 C74 1230 210 1090 548 638" fill="none" stroke="transparent" stroke-width="76" stroke-linecap="round"/>
          <circle cx="548" cy="638" r="37" fill="transparent"/>
        </g>
      </g>

      <!-- 第三幕：月影入碗。保留底图，SVG 只负责显月、金环和水的呼吸。 -->
      <g id="frame3" class="scene">
        <image href="hero-pull-dark.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none"/>
        <image id="moonlit" href="hero-pull-moonlit.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none" clip-path="url(#moonClip)"/>
        <g id="waterReflection" clip-path="url(#waterSurface)" pointer-events="none">
          <image href="hero-pull-moonlit.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none" filter="url(#waterMotion)" opacity=".92"/>
        </g>
        <g id="ripples" clip-path="url(#waterSurface)" pointer-events="none" filter="url(#waterSoft)">
          <ellipse cx="563" cy="1004" rx="12" ry="3.5" fill="none" stroke="#f0d69d" stroke-width="1.15" opacity="0"><animate attributeName="rx" begin="moonReveal.end+.18s" dur="3.4s" values="10;33;96" keyTimes="0;.26;1" repeatCount="indefinite"/><animate attributeName="ry" begin="moonReveal.end+.18s" dur="3.4s" values="3;8;24" keyTimes="0;.26;1" repeatCount="indefinite"/><animate attributeName="opacity" begin="moonReveal.end+.18s" dur="3.4s" values="0;.34;0" keyTimes="0;.18;1" repeatCount="indefinite"/></ellipse>
          <ellipse cx="563" cy="1004" rx="15" ry="4" fill="none" stroke="#d9a857" stroke-width=".85" opacity="0"><animate attributeName="rx" begin="moonReveal.end+1.25s" dur="3.4s" values="11;40;118" keyTimes="0;.28;1" repeatCount="indefinite"/><animate attributeName="ry" begin="moonReveal.end+1.25s" dur="3.4s" values="3;10;29" keyTimes="0;.28;1" repeatCount="indefinite"/><animate attributeName="opacity" begin="moonReveal.end+1.25s" dur="3.4s" values="0;.25;0" keyTimes="0;.16;1" repeatCount="indefinite"/></ellipse>
        </g>
        <g id="ring3" pointer-events="none" transform="translate(563 1002)">
          <circle r="39" fill="url(#ringHalo)" opacity=".68" filter="url(#goldGlow)"><animate attributeName="opacity" values=".26;.75;.26" dur="3.4s" repeatCount="indefinite"/></circle>
          <g><circle r="13" fill="none" stroke="#f3d28e" stroke-width="2.2"/><circle r="8.2" fill="none" stroke="#a76e2b" stroke-width="2.6"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.2s" repeatCount="indefinite"/></g>
        </g>
        <g id="pull3" class="hit" aria-label="轻牵红绳，让月亮出现">
          <path d="M88 1362 C106 1434 188 1478 286 1516" fill="none" stroke="transparent" stroke-width="72" stroke-linecap="round"/>
          <circle cx="90" cy="1361" r="31" fill="transparent"/>
        </g>
        <g id="festival" pointer-events="none" fill="#f1dfbc">
          <text x="512" y="520" text-anchor="middle" font-family="STKaiti, Kaiti SC, Songti SC, serif" font-size="64" letter-spacing="13" filter="url(#typeMist)">中秋快乐</text>
        </g>
      </g>
    </svg>
    <span class="a11y">轻牵红绳，跟随金环与月亮进入下一幕。</span>
  </main>
  <script>
    (() => {
      const story = document.getElementById('story');
      const scenes = [document.getElementById('frame1'), document.getElementById('frame2'), document.getElementById('frame3')];
      const reveal = document.getElementById('moonReveal');
      let stage = 0, active = false, startX = 0, finalRevealed = false, suppressClick = false;
      const point = event => { const p = story.createSVGPoint(); p.x = event.clientX; p.y = event.clientY; return p.matrixTransform(story.getScreenCTM().inverse()); };
      const setStage = next => { scenes[stage].classList.remove('active'); stage = next; scenes[stage].classList.add('active'); story.setAttribute('aria-label', next === 1 ? '金环正在引月入碗' : next === 2 ? '轻牵红绳，让月亮出现' : '轻牵红绳，继续故事'); };
      const advance = () => { if (stage < 2) { const next = stage + 1; window.setTimeout(() => setStage(next), 620); return; } if (!finalRevealed) { finalRevealed = true; scenes[2].classList.add('revealed'); reveal.beginElement(); story.setAttribute('aria-label','月亮已经显现，中秋快乐'); } };
      const hit = event => event.target.closest?.('.hit');
      story.addEventListener('pointerdown', event => { if (!hit(event)) return; active = true; startX = point(event).x; story.setPointerCapture?.(event.pointerId); });
      story.addEventListener('pointermove', event => { if (active && point(event).x - startX > 26) { active = false; suppressClick = true; advance(); } });
      story.addEventListener('pointerup', () => { if (active) { suppressClick = true; advance(); } active = false; });
      story.addEventListener('click', event => { if (suppressClick) { suppressClick = false; return; } if (hit(event)) advance(); });
      story.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); advance(); } });
    })();
  </script>
</body>
</html>
