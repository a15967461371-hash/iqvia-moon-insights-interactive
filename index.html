<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>月见洞察｜Signals Under One Moon</title>
  <meta name="description" content="A Mid-Autumn interaction guided by one red thread and a gold ring.">
  <style>
    :root { color-scheme: dark; background:#05070a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; background:#05070a; overflow:hidden; }
    main { width:min(100vw,750px); min-height:100dvh; display:grid; place-items:center; }
    #story { display:block; width:100%; max-height:100dvh; height:auto; touch-action:none; user-select:none; outline:none; }
    .scene { opacity:0; pointer-events:none; transition:opacity .75s cubic-bezier(.3,.8,.25,1); }
    .scene.active { opacity:1; pointer-events:auto; }
    .trigger { cursor:grab; }
    .trigger:active { cursor:grabbing; }
    .focus-halo { opacity:.28; transition:opacity .2s ease; }
    #story:focus-visible .scene.active .focus-halo { opacity:.82; }
    #waterFull, #moonFull, #festival, #ripples { opacity:0; transition:opacity .7s ease; }
    #frame3.final-active #waterFull { opacity:1; }
    #frame3.final-active #moonFull { opacity:1; transition-delay:.94s; transition-duration:1.25s; }
    #frame3.final-active #festival { opacity:1; transition-delay:2.18s; transition-duration:1.1s; }
    .a11y { position:fixed; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    @media (prefers-reduced-motion: reduce) {
      .scene, #waterFull, #moonFull, #festival { transition-duration:.18s !important; transition-delay:0s !important; }
      #story.reduced #ripples { opacity:.42; }
    }
  </style>
</head>
<body>
  <main>
    <svg id="story" viewBox="0 0 1024 1536" tabindex="0" role="application" aria-label="轻牵金环旁的红绳，完成月见故事">
      <defs>
        <filter id="goldGlow" x="-160%" y="-160%" width="420%" height="420%"><feGaussianBlur stdDeviation="6" result="soft"/><feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="waterSoft" x="-40%" y="-120%" width="180%" height="340%"><feGaussianBlur stdDeviation=".34"/></filter>
        <filter id="waterMotion" x="-18%" y="-35%" width="136%" height="170%"><feTurbulence id="waterNoise" type="fractalNoise" baseFrequency=".004 .012" numOctaves="1" seed="8" result="noise"/><feDisplacementMap id="waterDisplace" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>
        <filter id="typeMist" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation=".52"/></filter>
        <radialGradient id="ringHalo"><stop offset="0" stop-color="#fff3cb" stop-opacity=".64"/><stop offset=".38" stop-color="#e9bb69" stop-opacity=".16"/><stop offset="1" stop-color="#d8a14f" stop-opacity="0"/></radialGradient>
        <clipPath id="waterSurface"><ellipse cx="563" cy="1009" rx="207" ry="82"/></clipPath>
      </defs>

      <!-- 01｜纸月在案，碗中无月。局部牵动金环，环沿绳来到碗沿。 -->
      <g id="frame1" class="scene active">
        <image href="hero-story-1.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none"/>
        <path id="tension1" d="M72 1500 C112 1390 185 1216 281 1156" fill="none" stroke="#be2024" stroke-width="2.4" stroke-linecap="round" opacity="0"/>
        <g id="ring1" pointer-events="none" transform="translate(281 1156)">
          <circle class="focus-halo" r="43" fill="url(#ringHalo)" filter="url(#goldGlow)"/>
          <circle r="16" fill="none" stroke="#f6d594" stroke-width="1.7"/>
          <circle r="10" fill="none" stroke="#a96f31" stroke-width="2.5"/>
        </g>
        <g id="trigger1" class="trigger" aria-label="轻牵第一处金环">
          <circle cx="281" cy="1156" r="58" fill="#000" fill-opacity=".001"/>
          <path d="M110 1378 C162 1270 220 1196 281 1156" fill="none" stroke="#000" stroke-opacity=".001" stroke-width="64" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 02｜金环抵达碗沿，残月第一次映入水中。 -->
      <g id="frame2" class="scene">
        <image href="hero-story-2.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none"/>
        <path id="tension2" d="M105 1475 C144 1282 225 1094 313 1003" fill="none" stroke="#be2024" stroke-width="2.4" stroke-linecap="round" opacity="0"/>
        <g id="ring2" pointer-events="none" transform="translate(313 1003)">
          <circle class="focus-halo" r="43" fill="url(#ringHalo)" filter="url(#goldGlow)"/>
          <circle r="16" fill="none" stroke="#f6d594" stroke-width="1.7"/>
          <circle r="10" fill="none" stroke="#a96f31" stroke-width="2.5"/>
        </g>
        <g id="trigger2" class="trigger" aria-label="轻牵第二处金环">
          <circle cx="313" cy="1003" r="58" fill="#000" fill-opacity=".001"/>
          <path d="M165 1268 C226 1136 271 1056 313 1003" fill="none" stroke="#000" stroke-opacity=".001" stroke-width="64" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 03｜同一镜头的完成态：先水心、再月影、后月面与祝福。 -->
      <g id="frame3" class="scene">
        <image href="hero-story-2.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none"/>
        <image id="waterFull" href="hero-story-3.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none" clip-path="url(#waterSurface)" filter="url(#waterMotion)"/>
        <image id="moonFull" href="hero-story-3.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none"/>
        <g id="ring3" pointer-events="none" transform="translate(563 1002)" opacity="0">
          <circle r="39" fill="url(#ringHalo)" filter="url(#goldGlow)"/>
          <circle r="13" fill="none" stroke="#f3d28e" stroke-width="2.2"/>
          <circle r="8.2" fill="none" stroke="#a76e2b" stroke-width="2.6"/>
        </g>
        <g id="ripples" clip-path="url(#waterSurface)" pointer-events="none" filter="url(#waterSoft)">
          <ellipse cx="563" cy="1004" rx="10" ry="3" fill="none" stroke="#f0d69d" stroke-width="1.1" opacity="0"><animate id="ripple1x" attributeName="rx" begin="indefinite" dur="1.8s" values="10;35;94" keyTimes="0;.3;1" repeatCount="3"/><animate id="ripple1y" attributeName="ry" begin="indefinite" dur="1.8s" values="3;8;23" keyTimes="0;.3;1" repeatCount="3"/><animate id="ripple1o" attributeName="opacity" begin="indefinite" dur="1.8s" values="0;.35;0" keyTimes="0;.18;1" repeatCount="3"/></ellipse>
          <ellipse cx="563" cy="1004" rx="13" ry="4" fill="none" stroke="#d9a857" stroke-width=".82" opacity="0"><animate id="ripple2x" attributeName="rx" begin="indefinite" dur="1.8s" values="13;42;115" keyTimes="0;.3;1" repeatCount="3"/><animate id="ripple2y" attributeName="ry" begin="indefinite" dur="1.8s" values="4;10;28" keyTimes="0;.3;1" repeatCount="3"/><animate id="ripple2o" attributeName="opacity" begin="indefinite" dur="1.8s" values="0;.24;0" keyTimes="0;.18;1" repeatCount="3"/></ellipse>
          <ellipse class="reduced-ripple" cx="563" cy="1004" rx="76" ry="19" fill="none" stroke="#e5be72" stroke-width=".85" opacity="0"/>
        </g>
        <g id="festival" pointer-events="none" fill="#f1dfbc"><text x="512" y="520" text-anchor="middle" font-family="STKaiti, Kaiti SC, Songti SC, serif" font-size="64" letter-spacing="13" filter="url(#typeMist)">中秋快乐</text></g>
      </g>
    </svg>
    <span class="a11y" aria-live="polite" id="status">纸月在案，轻牵金环旁的红绳。</span>
  </main>
  <script>
    (() => {
      const story = document.getElementById('story');
      const status = document.getElementById('status');
      const scenes = [document.getElementById('frame1'), document.getElementById('frame2'), document.getElementById('frame3')];
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) story.classList.add('reduced');
      const actions = [
        { ring:document.getElementById('ring1'), tension:document.getElementById('tension1'), trigger:document.getElementById('trigger1'), start:[281,1156], end:[313,1003] },
        { ring:document.getElementById('ring2'), tension:document.getElementById('tension2'), trigger:document.getElementById('trigger2'), start:[313,1003], end:[563,1002] }
      ];
      let stage = 0, drag = null, locked = false;
      const svgPoint = event => { const p = story.createSVGPoint(); p.x = event.clientX; p.y = event.clientY; return p.matrixTransform(story.getScreenCTM().inverse()); };
      const clamp = value => Math.max(0, Math.min(1, value));
      const place = (action, progress) => {
        const [sx, sy] = action.start, [ex, ey] = action.end;
        const x = sx + (ex - sx) * progress, y = sy + (ey - sy) * progress;
        action.ring.setAttribute('transform', `translate(${x} ${y})`);
        action.tension.setAttribute('opacity', progress > .02 ? '.86' : '0');
        action.tension.setAttribute('d', `M72 1500 C118 1375 ${Math.round((sx+x)/2)} ${Math.round((sy+y)/2)} ${Math.round(x)} ${Math.round(y)}`);
      };
      const switchTo = next => { scenes[stage].classList.remove('active'); stage = next; scenes[stage].classList.add('active'); };
      const runRipples = () => {
        if (reduced) return;
        ['ripple1x','ripple1y','ripple1o','ripple2x','ripple2y','ripple2o'].forEach(id => document.getElementById(id).beginElement());
        const noise = document.getElementById('waterNoise'), displace = document.getElementById('waterDisplace');
        let tick = 0; const timer = window.setInterval(() => { tick += 1; const amount = tick % 2 ? 2.1 : .65; displace.setAttribute('scale', amount); noise.setAttribute('baseFrequency', tick % 2 ? '.011 .027' : '.005 .014'); if (tick >= 6) { displace.setAttribute('scale','0'); window.clearInterval(timer); } }, 300);
      };
      const finish = index => {
        if (locked || index !== stage) return;
        locked = true; place(actions[index], 1);
        if (index === 0) {
          status.textContent = '金环抵达碗沿，残月映入水中。';
          window.setTimeout(() => { switchTo(1); locked = false; }, reduced ? 180 : 760);
          return;
        }
        status.textContent = '金环入水，月影正在成圆。';
        window.setTimeout(() => {
          switchTo(2);
          document.getElementById('ring3').setAttribute('opacity','1');
          document.getElementById('frame3').classList.add('final-active');
          runRipples();
          window.setTimeout(() => { status.textContent = '月影成圆。中秋快乐。'; locked = false; }, reduced ? 260 : 2600);
        }, reduced ? 180 : 760);
      };
      actions.forEach((action, index) => {
        action.trigger.addEventListener('pointerdown', event => { if (locked || stage !== index) return; drag = { index, pointerId:event.pointerId }; action.trigger.setPointerCapture?.(event.pointerId); });
        action.trigger.addEventListener('pointermove', event => {
          if (!drag || drag.index !== index || locked) return;
          const p = svgPoint(event); const [sx,sy] = action.start, [ex,ey] = action.end;
          const dx = ex-sx, dy = ey-sy; const progress = clamp(((p.x-sx)*dx + (p.y-sy)*dy) / (dx*dx + dy*dy));
          place(action, progress);
          if (progress > .86) { drag = null; finish(index); }
        });
        action.trigger.addEventListener('pointerup', () => { if (drag?.index === index && !locked) finish(index); drag = null; });
        action.trigger.addEventListener('pointercancel', () => { if (drag?.index === index) { place(action,0); drag = null; } });
        action.trigger.addEventListener('click', event => { event.preventDefault(); if (!locked && stage === index) finish(index); });
      });
      story.addEventListener('keydown', event => { if ((event.key === 'Enter' || event.key === ' ') && stage < 2) { event.preventDefault(); finish(stage); } });
    })();
  </script>
</body>
</html>
