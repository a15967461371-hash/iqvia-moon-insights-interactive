<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>月见洞察｜Signals Under One Moon</title>
  <meta name="description" content="IQVIA Mid-Autumn interactive SVG: Signals Under One Moon.">
  <style>
    :root { color-scheme: dark; background: #17100c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: radial-gradient(circle at 50% 14%, #4a2d16 0, #21150e 45%, #120b08 100%); }
    main { width: min(100vw, 750px); display: grid; place-items: center; overflow: hidden; }
    object { display: block; width: 100%; aspect-ratio: 2 / 3; height: auto; border: 0; }
    .assist { position: fixed; right: 18px; bottom: 18px; margin: 0; padding: 8px 10px; border: 1px solid #b88343; border-radius: 999px; color: #e9cca0; background: rgb(20 12 7 / 72%); font: 11px/1.2 Arial, "Microsoft YaHei", sans-serif; letter-spacing: .08em; pointer-events: none; }
  </style>
</head>
<body>
  <main aria-label="IQVIA 月见洞察 SVG 互动页">
    <object id="scene" data="moon-insights.svg" type="image/svg+xml" aria-label="轻触金色微光，观看信号相连、月面汇成与月光抵达"></object>
  </main>
  <p class="assist">轻触金色微光</p>
  <script>
    const scene = document.getElementById('scene');
    const hint = document.querySelector('.assist');
    scene.addEventListener('load', () => {
      const ring = scene.contentDocument?.getElementById('goldRing') || scene.contentDocument?.getElementById('goldRing2');
      if (!ring) return;
      ring.addEventListener('click', () => {
        const next = ring.id === 'goldRing' ? 'moon-insights-next.svg' : 'moon-insights-final.svg';
        hint.textContent = next === 'moon-insights-next.svg' ? '轻触下一枚金色节点' : '月光抵达';
        if (next === 'moon-insights-final.svg') hint.style.opacity = '0';
        window.setTimeout(() => { scene.data = next; }, 1200);
      }, { once: true });
    });
  </script>
</body>
</html>
