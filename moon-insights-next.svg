<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-label="月见洞察：逻辑线汇成完整月面">
  <defs><filter id="glow2" x="-200%" y="-200%" width="400%" height="400%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <image href="hero-next.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none"/>
  <g id="goldRing2" style="cursor:pointer" aria-label="轻触金色节点">
    <circle cx="418" cy="881" r="25" fill="#d5a85d" opacity=".11" filter="url(#glow2)"><animate attributeName="r" values="20;32;20" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".08;.30;.08" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="418" cy="881" r="13" fill="none" stroke="#f5da9b" stroke-width="1.6"/><circle cx="418" cy="881" r="8.5" fill="none" stroke="#a96f31" stroke-width="2.5"/><circle cx="418" cy="881" r="2.7" fill="#fff3c9"/>
    <animateMotion begin="goldRing2.click" dur="1.1s" path="M0 0 C-30 52,42 92,110 111" fill="freeze"/>
  </g>
  <rect width="1024" height="1536" fill="#07111c" opacity=".36" pointer-events="none"><animate attributeName="opacity" dur=".7s" values=".36;0" fill="freeze"/></rect>
</svg>
