<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-label="月光自然抵达茶碗，轻触放大后出现中秋祝福">
  <defs>
    <filter id="mist" x="-60%" y="-80%" width="220%" height="260%">
      <feGaussianBlur stdDeviation="2.7"/>
    </filter>
    <filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lensClip">
      <circle cx="182" cy="1280" r="0">
        <animate attributeName="r" begin="bowlWord.click" dur="1.12s" values="0;0;370" keyTimes="0;.17;1" fill="freeze"/>
      </circle>
    </clipPath>
    <radialGradient id="lensFade">
      <stop offset="0" stop-color="#fff1ca" stop-opacity=".20"/>
      <stop offset=".72" stop-color="#f1c879" stop-opacity=".07"/>
      <stop offset="1" stop-color="#f1c879" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 同一画面由暗到亮：用自然月光版渐显，而非几何光束覆盖月面。 -->
  <image href="hero-final.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none"/>
  <image href="hero-final-lit.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none" opacity="0">
    <animate attributeName="opacity" begin=".2s" dur="3.7s" values="0;0;.22;.72;1" keyTimes="0;.13;.46;.76;1" fill="freeze"/>
  </image>

  <!-- 茶碗上的朦胧文字在月光落定后显影。 -->
  <g id="bowlWord" style="cursor:pointer" opacity="0" aria-label="轻触茶碗，放大月见">
    <ellipse cx="182" cy="1272" rx="87" ry="62" fill="transparent"/>
    <text x="182" y="1287" text-anchor="middle" fill="#f7dfaa" font-family="STKaiti,Kaiti SC,serif" font-size="29" letter-spacing="8" filter="url(#mist)">月见</text>
    <text x="182" y="1287" text-anchor="middle" fill="#f7dfaa" font-family="STKaiti,Kaiti SC,serif" font-size="29" letter-spacing="8" opacity=".32">月见</text>
    <animate attributeName="opacity" begin="3.45s" dur="1.25s" values="0;0;.62" keyTimes="0;.3;1" fill="freeze"/>
  </g>

  <!-- 点击后以真正放大的同一画面作为圆形镜头，而不是新增一张异质画面。 -->
  <g clip-path="url(#lensClip)" opacity="0">
    <image href="hero-final-lit.png" x="-182" y="-1280" width="2048" height="3072" preserveAspectRatio="none"/>
    <circle cx="182" cy="1280" r="370" fill="url(#lensFade)"/>
    <animate attributeName="opacity" begin="bowlWord.click" dur=".25s" values="0;1" fill="freeze"/>
  </g>
  <circle cx="182" cy="1280" r="0" fill="none" stroke="#f7d590" stroke-width="1" opacity="0" pointer-events="none" filter="url(#softGlow)">
    <animate attributeName="r" begin="bowlWord.click" dur="1.2s" values="0;48;390" keyTimes="0;.23;1" fill="freeze"/>
    <animate attributeName="opacity" begin="bowlWord.click" dur="1.2s" values="0;.72;0" keyTimes="0;.2;1" fill="freeze"/>
  </circle>
  <text x="512" y="1441" text-anchor="middle" fill="#f1dfbc" font-family="Songti SC,STSong,serif" font-size="38" letter-spacing="8" opacity="0">中秋快乐
    <animate attributeName="opacity" begin="bowlWord.click+1.02s" dur="1.35s" values="0;0;1" keyTimes="0;.24;1" fill="freeze"/>
  </text>
</svg>
