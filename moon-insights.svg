<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-label="月见洞察互动主图：轻触红线上的金环">
  <defs>
    <filter id="glow" x="-200%" y="-200%" width="400%" height="400%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- The approved master visual remains untouched. -->
  <image href="hero-master.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none"/>
  <!-- The sole interactive layer: a gold ring sitting on the master image's red signal line. -->
  <g id="goldRing" style="cursor:pointer" aria-label="轻触红线上的金环">
    <circle cx="396" cy="718" r="25" fill="#d5a85d" opacity=".12" filter="url(#glow)">
      <animate attributeName="r" values="20;32;20" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".08;.30;.08" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="396" cy="718" r="13" fill="none" stroke="#f5da9b" stroke-width="1.6"/>
    <circle cx="396" cy="718" r="8.5" fill="none" stroke="#a96f31" stroke-width="2.5"/>
    <circle cx="396" cy="718" r="2.7" fill="#fff3c9"/>
    <g>
      <circle r="16" fill="none" stroke="#f4cc78" stroke-width="1.1" stroke-dasharray="18 74" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0 396 718" to="360 396 718" dur="3.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <g id="returnRing" opacity="0" pointer-events="none">
    <circle cx="396" cy="718" r="24" fill="none" stroke="#f6d993" stroke-width="1.2" opacity=".7">
      <animate attributeName="r" begin="goldRing.click" dur=".55s" values="12;35" fill="freeze"/>
      <animate attributeName="opacity" begin="goldRing.click" dur=".55s" values=".8;0" fill="freeze"/>
    </circle>
    <animate attributeName="opacity" begin="goldRing.click" dur=".01s" values="1;1" fill="freeze"/>
  </g>
</svg>
